[global]

[auth]
flow_type = "pkce"
auth.flow_type = "pkce"
google_client_id = "env(GOOGLE_CLIENT_ID)"
google_client_secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_urls = [
  "http://localhost:8080/auth/callback",
  "http://localhost:8080/email-calendar/callback",
  "https://alai-social-whisperer.com/auth/callback",
  "https://alai-social-whisperer.com/email-calendar/callback",
  "https://preview--alai-social-whisperer.lovable.app/auth/callback",
  "https://preview--alai-social-whisperer.lovable.app/email-calendar/callback"
]

[[functions]]
name = "calendar"
verify_jwt = true
cors_origins = [
  "http://localhost:*",
  "https://alai-social-whisperer.com",
  "https://preview--alai-social-whisperer.lovable.app"
]
cors_headers = [
  "Authorization",
  "apikey",
  "Content-Type",
  "X-Client-Info",
  "X-Google-Token",
  "x-google-token"
]

